<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Leaflet Test</title>
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <style>html,body,#map{height:100%;margin:0;padding:0}#map{width:100vw;height:100vh}</style>
</head>
<body>
  <div id="map"></div>
  <script src="vendor/leaflet.js"></script>
  <script>
    try {
      const map = L.map('map').setView([35,105],4);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:12}).addTo(map);
      console.log('Leaflet loaded, map created');
    } catch(e) {
      console.error('Leaflet test error', e);
      document.body.innerHTML = '<pre style="color:red">Leaflet test error:\n'+e.toString()+'</pre>';
    }
  </script>
</body>
</html>
